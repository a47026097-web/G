<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دردشة - محمد حسنين</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #111b21; color: #e9edef; display: flex; height: 100vh; justify-content: center; align-items: center; }
        #auth-container, #chat-container { background: #222e35; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); padding: 20px; width: 90%; max-width: 500px; text-align: center; }
        #chat-container { display: none; height: 90vh; flex-direction: column; max-width: 800px; width: 95%; }
        h1 { margin-bottom: 20px; color: #00a884; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; outline: none; font-size: 16px; }
        input { background: #2a3942; color: #fff; }
        button { background: #00a884; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #008f72; }
        #messages-area { flex: 1; background: #0b141a; border-radius: 5px; padding: 15px; overflow-y: auto; text-align: right; margin-bottom: 10px; display: flex; flex-direction: column; }
        .msg { background: #202c33; padding: 8px 12px; border-radius: 7px; margin: 5px 0; max-width: 70%; width: fit-content; word-break: break-all; }
        .msg.me { background: #005c4b; align-self: flex-end; }
        #users-list { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #2a3942; margin-bottom: 10px; }
        .user-tag { background: #2a3942; padding: 5px 12px; border-radius: 15px; font-size: 14px; white-space: nowrap; }
        .user-tag.online { border: 1px solid #00a884; }
        #call-bar { background: #182229; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #voice-status { color: #00a884; font-weight: bold; }
        #call-box { display: none; background: #005c4b; padding: 15px; border-radius: 5px; margin-bottom: 10px; justify-content: space-around; align-items: center; }
        .dev-credit { font-size: 12px; color: #8696a0; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="auth-container">
        <h1># دردشة</h1>
        <p>سجّل الدخول باسمك لبدء المخابرة</p>
        <input type="text" id="username-input" placeholder="اكتب اسم المستخدم هنا...">
        <button id="login-btn">دخول</button>
        <p class="dev-credit">المطور: محمد حسنين</p>
    </div>

    <div id="chat-container">
        <div id="call-bar">
            <div>
                <span id="voice-status">الدردشة العامة (نصية)</span>
            </div>
            <button id="start-call-btn" style="width: auto; margin: 0; padding: 8px 15px; background: #00a884;">دك مكالمة 📞</button>
            <button id="leave-call-btn" style="width: auto; margin: 0; padding: 8px 15px; background: #ea0038; display: none;">إنهاء المكالمة ❌</button>
        </div>

        <div id="call-box">
            <span id="call-msg">مكالمة واردة من...</span>
            <div style="display: flex; gap: 10px;">
                <button id="accept-call-btn" style="background: #00a884; padding: 5px 15px; width: auto;">قبول</button>
                <button id="reject-call-btn" style="background: #ea0038; padding: 5px 15px; width: auto;">رفض</button>
            </div>
        </div>

        <div id="users-list"></div>

        <div id="messages-area"></div>

        <div style="display: flex; gap: 10px;">
            <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا..." style="margin: 0; flex: 1;">
            <button id="send-btn" style="margin: 0; width: auto; padding: 0 25px;">إرسال</button>
        </div>
        <p class="dev-credit" style="margin-top: 5px;">المطور: محمد حسنين</p>
    </div>

    <script>
        const socket = io(); 

        let myUsername = "";
        let localStream = null;
        let peerConnections = {};
        let currentRoomId = null;

        const rtcConfig = {
            iceServers: [{ urls: "stun:://google.com" }]
        };

        const authContainer = document.getElementById("auth-container");
        const chatContainer = document.getElementById("chat-container");
        const usernameInput = document.getElementById("username-input");
        const loginBtn = document.getElementById("login-btn");
        const messagesArea = document.getElementById("messages-area");
        const msgInput = document.getElementById("msg-input");
        const sendBtn = document.getElementById("send-btn");
        const usersList = document.getElementById("users-list");
        const startCallBtn = document.getElementById("start-call-btn");
        const leaveCallBtn = document.getElementById("leave-call-btn");
        const callBox = document.getElementById("call-box");
        const callMsg = document.getElementById("call-msg");
        const acceptCallBtn = document.getElementById("accept-call-btn");
        const rejectCallBtn = document.getElementById("reject-call-btn");
        const voiceStatus = document.getElementById("voice-status");

        loginBtn.onclick = () => {
            const user = usernameInput.value.trim();
            if (user) {
                myUsername = user;
                socket.emit("verify_user", user);
            }
        };

        socket.on("auth_success", (username) => {
            authContainer.style.display = "none";
            chatContainer.style.display = "flex";
            socket.emit("join_group", "general");
        });

        socket.on("auth_error", (err) => { alert(err); });

        socket.on("update_users", (users) => {
            usersList.innerHTML = "";
            for (const name in users) {
                const tag = document.createElement("div");
                tag.className = `user-tag ${users[name].status === 'متصل' ? 'online' : ''}`;
                tag.innerText = `${name} (${users[name].status})`;
                usersList.appendChild(tag);
            }
        });

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text) {
                socket.emit("send_message", {
                    chat: "general",
                    type: "text",
                    text: text
                });
                msgInput.value = "";
            }
        }
        sendBtn.onclick = sendMessage;
        msgInput.onkeypress = (e) => { if (e.key === "Enter") sendMessage(); };

        socket.on("receive_message", (msg) => {
            const div = document.createElement("div");
            div.className = `msg ${msg.username === myUsername ? 'me' : ''}`;
            div.innerText = `${msg.username}: ${msg.text}`;
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        });

        startCallBtn.onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                voiceStatus.innerText = "جاري إنشاء غرفة مكالمة... 📞";
                socket.emit("create_call_room", {});
            } catch (err) {
                alert("يرجى السماح بصلاحية المايكروفون لتتمكن من الكلام!");
                console.error(err);
            }
        };

        socket.on("call_room_created", (data) => {
            currentRoomId = data.roomId;
            voiceStatus.innerText = "داخل المكالمة الصوتية الآن 🟢";
            startCallBtn.style.display = "none";
            leaveCallBtn.style.display = "block";
            
            socket.emit("send_message", {
                chat: "general",
                type: "text",
                text: `📞 قمت ببدء مكالمة جماعية، اضغطوا على زر الدك للانضمام معي بنفس الرابط!`
            });
        });

        leaveCallBtn.onclick = () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            socket.emit("leave_call_room", { roomId: currentRoomId });
            voiceStatus.innerText = "الدردشة العامة (نصية)";
            startCallBtn.style.display = "block";
            leaveCallBtn.style.display = "none";
            
            for (let id in peerConnections) {
                peerConnections[id].close();
            }
            peerConnections = {};
        };

        socket.on("call_signal", async (signal) => {
            if (signal.from === myUsername) return;

            if (!peerConnections[signal.from]) {
                initPeerConnection(signal.from);
            }

            const pc = peerConnections[signal.from];

            if (signal.type === "offer") {
                await pc.setRemoteDescription(new RTCSessionDescription(signal.data));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit("call_signal", { roomId: currentRoomId, type: "answer", data: answer });
            } else if (signal.type === "answer") {
                await pc.setRemoteDescription(new RTCSessionDescription(signal.data));
            } else if (signal.type === "candidate") {
                await pc.addIceCandidate(new RTCIceCandidate(signal.data));
            }
        });

        function initPeerConnection(targetUser) {
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[targetUser] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => {
                let audioNode = document.getElementById(`audio-${targetUser}`);
                if (!audioNode) {
Use code with caution.
audioNode = document.createElement("audio");
audioNode.id = audio-${targetUser};
audioNode.autoplay = true;
document.body.appendChild(audioNode);
}
audioNode.srcObject = event.streams;
};
pc.onicecandidate = (event) => {
if (event.candidate) {
socket.emit("call_signal", { roomId: currentRoomId, type: "candidate", data: event.candidate });
}
};
}
